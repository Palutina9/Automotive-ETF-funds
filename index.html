<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازدهی صندوق‌های بخشی خودرو</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #FBF2E3;
    --panel: #FFFCF5;
    --ink: #2E2416;
    --muted: #8C7A62;
    --teal: #0F6659;
    --teal-soft: #EAF0E6;
    --gain: #1E8A5F;
    --gain-bg: #EEF7EC;
    --loss: #C1443B;
    --loss-bg: #FBEBE6;
    --line: #EBDCC0;
    --badge: #B9852E;
    --badge-bg: #FBF0DC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Vazirmatn', sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 64px; }

  .topbar { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 1080px; margin: 0 auto; padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--teal); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand h1 { font-size: 17px; font-weight: 700; margin: 0; line-height: 1.3; }
  .brand .sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .brand .sub .dot { color: var(--line); }

  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .freshness { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; font-family: inherit; }
  .btn:hover { background: #FBF6EA; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
  .btn.primary:hover { background: #0C554A; }
  .icon { width: 15px; height: 15px; flex-shrink: 0; }
  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { padding-top: 24px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .kpi-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .kpi-card .label { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .kpi-card .value { font-size: 19px; font-weight: 700; margin: 0; font-variant-numeric: tabular-nums; }
  .kpi-card .subvalue { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .kpi-icon { width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; margin-bottom: 24px; }
  .panel h2 { font-size: 16px; font-weight: 700; margin: 0 0 16px; }
  .panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .panel-head h2 { margin: 0; }
  select.period-select { font-family: inherit; font-size: 13px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }

  .chart-box { height: 280px; }

  .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
  .nav-card { background: var(--teal-soft); border-radius: 10px; padding: 16px; }
  .nav-card .name { font-size: 13px; color: var(--teal); font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .nav-card .value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: right; font-weight: 600; }
  thead th { color: var(--muted); font-weight: 600; font-size: 13px; border-bottom: 2px solid var(--line); }
  tbody tr:hover { background: #FBF6EA; }
  tr.daily-row { background: var(--teal-soft); font-weight: 700; }
  tr.daily-row td { border-bottom: 2px solid var(--line); }

  .pct { font-variant-numeric: tabular-nums; font-weight: 600; padding: 3px 8px; border-radius: 6px; display: inline-block; }
  .pct.gain { color: var(--gain); background: var(--gain-bg); }
  .pct.loss { color: var(--loss); background: var(--loss-bg); }
  .pct.flat { color: var(--muted); background: transparent; }
  .na { color: var(--line); }

  .badge-manual { font-size: 10px; color: var(--badge); background: var(--badge-bg); border: 1px solid #EAD9AE; border-radius: 5px; padding: 1px 6px; font-weight: 600; margin-inline-start: 6px; }

  .empty-state { text-align: center; color: var(--muted); padding: 40px 20px; }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 12px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } .spin { animation: none !important; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon">
        <svg class="icon" style="width:20px;height:20px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
      </div>
      <div>
        <h1>داشبورد بازدهی صندوق‌ها</h1>
        <div class="sub">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="todayDate">—</span>
          <span class="dot">•</span>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="clockNow">—</span>
        </div>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="freshness">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="freshnessText">در حال بارگذاری…</span>
      </span>
      <button class="btn" id="refreshBtn">
        <svg class="icon" id="refreshIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 1 1 2.13 9.36L1 20"/></svg>
        به‌روزرسانی
      </button>
      <button class="btn primary" id="exportBtn" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        خروجی اکسل
      </button>
    </div>
  </div>
</div>

<div class="wrap">
<main>

  <section class="kpi-grid" id="kpiGrid"></section>

  <section class="panel">
    <h2>ارزش خالص دارایی (NAV)</h2>
    <div id="navGrid" class="nav-grid"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>مقایسه بازدهی</h2>
      <select class="period-select" id="periodSelect"></select>
    </div>
    <div class="chart-box"><canvas id="periodChart"></canvas></div>
  </section>

  <section class="panel">
    <h2>جدول بازدهی دوره‌ای</h2>
    <div id="tableHost"></div>
  </section>

  <footer>داده‌ها به‌صورت خودکار و دستی از منابع رسمی صندوق‌ها گردآوری می‌شود.</footer>

</main>
</div>

<script>
const PERIOD_KEYS = ["SIMPLE_WEEKLY", "SIMPLE_MONTHLY", "SIMPLE_MONTHLY3", "SIMPLE_MONTHLY6", "SIMPLE_YEARLY", "SIMPLE_ALL_DAYS", "MAX_SIMPLE_WEEKLY", "MIN_SIMPLE_WEEKLY"];
const PERIOD_LABELS = {
  SIMPLE_WEEKLY: "هفته گذشته",
  SIMPLE_MONTHLY: "ماه گذشته",
  SIMPLE_MONTHLY3: "۳ ماه اخیر",
  SIMPLE_MONTHLY6: "۶ ماه",
  SIMPLE_YEARLY: "یک سال اخیر",
  SIMPLE_ALL_DAYS: "از ابتدای فعالیت",
  MAX_SIMPLE_WEEKLY: "حداکثر بازدهی هفتگی",
  MIN_SIMPLE_WEEKLY: "حداقل بازدهی هفتگی",
};
const FUND_NAMES_FA = { AutoAgah: "آگاه خودرو", AutoDariush: "داریوش خودرو", Khodran: "خودران" };
const CHART_COLORS = ["#0F6659", "#B9852E", "#5B7FBF", "#9C5B8C", "#4E8C6B", "#C1443B"];

function fmtPctText(v) {
  if (v === null || v === undefined || !isFinite(v)) return "—";
  const sign = v > 0 ? "+" : "";
  return sign + v.toLocaleString("fa-IR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "٪";
}
function fmtPct(v) {
  if (v === null || v === undefined || !isFinite(v)) return '<span class="na">—</span>';
  const cls = v > 0 ? "gain" : v < 0 ? "loss" : "flat";
  return `<span class="pct ${cls}">${fmtPctText(v)}</span>`;
}
function fmtNav(v) {
  if (v === null || v === undefined || !isFinite(v)) return "—";
  return Math.round(v).toLocaleString("fa-IR");
}
function toFaDigits(s) { return String(s).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[Number(d)]); }
function todayJalaliLong() {
  try { return new Intl.DateTimeFormat("fa-IR", { weekday: "long", year: "numeric", month: "long", day: "numeric" }).format(new Date()); }
  catch { return new Date().toLocaleDateString(); }
}
function nowTimeFa() {
  try { return new Intl.DateTimeFormat("fa-IR", { hour: "2-digit", minute: "2-digit" }).format(new Date()); }
  catch { return ""; }
}
function relativeTime(iso) {
  if (!iso) return "هرگز";
  const sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (sec < 60) return "لحظاتی پیش";
  if (sec < 3600) return `${Math.floor(sec / 60)} دقیقه پیش`;
  if (sec < 86400) return `${Math.floor(sec / 3600)} ساعت پیش`;
  return `${Math.floor(sec / 86400)} روز پیش`;
}

function parseDataset(list) {
  const periods = []; let marketDaily = null; const funds = {}; const order = [];
  if (!Array.isArray(list)) return { periods, marketDaily, funds, order };
  const ensureFund = (slug) => {
    if (!funds[slug]) { funds[slug] = { simpleReturns: new Array(PERIOD_KEYS.length).fill(null), nav: null, dailyReturn: null }; order.push(slug); }
    return funds[slug];
  };
  for (const obj of list) {
    if (!obj || typeof obj !== "object") continue;
    if (obj.key !== undefined) {
      periods.push({ key: obj.key, fromDate: obj.fromDate, toDate: obj.toDate, marketSimpleReturn: obj.marketSimpleReturn });
      continue;
    }
    if (obj.marketDailyReturn !== undefined) { marketDaily = obj.marketDailyReturn; continue; }
    const entryKey = Object.keys(obj)[0];
    if (!entryKey) continue;
    const value = obj[entryKey];
    let m;
    if ((m = entryKey.match(/^(.+)_fundSimpleReturn$/))) {
      const acc = ensureFund(m[1]);
      const idx = acc.simpleReturns.findIndex(x => x === null);
      if (idx >= 0) acc.simpleReturns[idx] = typeof value === "number" ? value : null;
    } else if ((m = entryKey.match(/^(.+)_fundNAV$/))) {
      ensureFund(m[1]).nav = typeof value === "number" ? value : null;
    } else if ((m = entryKey.match(/^(.+)_fundDailyReturn$/))) {
      ensureFund(m[1]).dailyReturn = typeof value === "number" ? value : null;
    }
  }
  return { periods, marketDaily, funds, order };
}

function mergeDatasets(auto, manual) {
  const a = parseDataset(auto), b = parseDataset(manual);
  const periods = a.periods.length ? a.periods : b.periods;
  const marketDaily = a.marketDaily ?? b.marketDaily;
  const funds = { ...a.funds, ...b.funds };
  const order = [...a.order, ...b.order.filter(s => !a.order.includes(s))];
  const manualSlugs = new Set(b.order);
  return { periods, marketDaily, funds, order, manualSlugs };
}

function renderKpis(state) {
  const { funds, order } = state;
  const grid = document.getElementById("kpiGrid");
  const totalNav = order.reduce((s, slug) => s + (funds[slug].nav || 0), 0);
  const dailyVals = order.map(s => funds[s].dailyReturn).filter(v => v !== null && isFinite(v));
  const avgDaily = dailyVals.length ? dailyVals.reduce((s, v) => s + v, 0) / dailyVals.length : null;
  const yearIdx = PERIOD_KEYS.indexOf("SIMPLE_YEARLY");
  let best = null;
  for (const slug of order) {
    const v = funds[slug].simpleReturns[yearIdx];
    if (v !== null && isFinite(v) && (!best || v > best.value)) best = { name: FUND_NAMES_FA[slug] || slug, value: v };
  }

  const cards = [
    { label: "تعداد صندوق‌ها", value: toFaDigits(String(order.length)), sub: null, bg: "#EAF0E6", fg: "#0F6659",
      icon: '<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/>' },
    { label: "مجموع دارایی (NAV)", value: fmtNav(totalNav), sub: "مجموع خالص ارزش دارایی‌ها", bg: "#EEF7EC", fg: "#1E8A5F",
      icon: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/>' },
    { label: "میانگین بازدهی روزانه", value: fmtPctText(avgDaily), sub: "میانگین همه صندوق‌ها", bg: (avgDaily ?? 0) < 0 ? "#FBEBE6" : "#EEF7EC", fg: (avgDaily ?? 0) < 0 ? "#C1443B" : "#1E8A5F",
      icon: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>' },
    { label: "بهترین بازدهی یک‌ساله", value: best ? fmtPctText(best.value) : "—", sub: best ? best.name : "—", bg: "#FBF0DC", fg: "#B9852E",
      icon: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>' },
  ];

  grid.innerHTML = cards.map(c => `
    <div class="kpi-card">
      <div>
        <p class="label">${c.label}</p>
        <p class="value">${c.value}</p>
        ${c.sub ? `<p class="subvalue">${c.sub}</p>` : ""}
      </div>
      <div class="kpi-icon" style="background:${c.bg};color:${c.fg}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg>
      </div>
    </div>
  `).join("");
}

function renderNav(state) {
  const { funds, order, manualSlugs } = state;
  const grid = document.getElementById("navGrid");
  const entries = order.filter(slug => funds[slug].nav !== null);
  if (entries.length === 0) { grid.innerHTML = '<div class="empty-state">داده‌ای موجود نیست</div>'; return; }
  grid.innerHTML = entries.map(slug => `
    <div class="nav-card">
      <div class="name">${FUND_NAMES_FA[slug] || slug}${manualSlugs.has(slug) ? '<span class="badge-manual">دستی</span>' : ""}</div>
      <div class="value">${fmtNav(funds[slug].nav)}</div>
    </div>
  `).join("");
}

function renderTable(state) {
  const { periods, marketDaily, funds, order, manualSlugs } = state;
  const host = document.getElementById("tableHost");
  if (order.length === 0 && periods.length === 0) { host.innerHTML = '<div class="empty-state">هنوز داده‌ای برای نمایش وجود ندارد</div>'; return; }

  const head = `<tr><th>دوره</th><th>بازار</th>${order.map(slug => `<th>${FUND_NAMES_FA[slug] || slug}${manualSlugs.has(slug) ? '<span class="badge-manual">دستی</span>' : ""}</th>`).join("")}</tr>`;
  const dailyRow = `<tr class="daily-row"><td>بازدهی روزانه</td><td>${fmtPct(marketDaily)}</td>${order.map(slug => `<td>${fmtPct(funds[slug].dailyReturn)}</td>`).join("")}</tr>`;
  const periodRows = PERIOD_KEYS.map((pk, i) => {
    const periodRow = periods.find(p => p.key === pk);
    const marketVal = periodRow ? periodRow.marketSimpleReturn : null;
    return `<tr><td>${PERIOD_LABELS[pk]}</td><td>${fmtPct(marketVal)}</td>${order.map(slug => `<td>${fmtPct(funds[slug].simpleReturns[i])}</td>`).join("")}</tr>`;
  }).join("");

  host.innerHTML = `<table><thead>${head}</thead><tbody>${dailyRow}${periodRows}</tbody></table>`;
}

let chartInstance = null;
function renderChart(state, selectedKey) {
  const { periods, marketDaily, funds, order } = state;
  const ctx = document.getElementById("periodChart");
  let marketVal, values;
  if (selectedKey === "daily") {
    marketVal = marketDaily;
    values = order.map(s => funds[s].dailyReturn);
  } else {
    const idx = PERIOD_KEYS.indexOf(selectedKey);
    const periodRow = periods.find(p => p.key === selectedKey);
    marketVal = periodRow ? periodRow.marketSimpleReturn : null;
    values = order.map(s => funds[s].simpleReturns[idx]);
  }
  const labels = ["بازار", ...order.map(s => FUND_NAMES_FA[s] || s)];
  const data = [marketVal, ...values];

  if (chartInstance) chartInstance.destroy();
  if (data.every(v => v === null || v === undefined || !isFinite(v))) {
    ctx.getContext("2d").clearRect(0, 0, ctx.width, ctx.height);
    return;
  }
  chartInstance = new Chart(ctx, {
    type: "bar",
    data: { labels, datasets: [{ data, backgroundColor: ["#8C7A62", ...order.map((_, i) => CHART_COLORS[i % CHART_COLORS.length])], borderRadius: 6, maxBarThickness: 56 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { ticks: { callback: v => v + "٪" }, grid: { color: "#EBDCC0" } }, x: { grid: { display: false } } }
    }
  });
}

function setupPeriodSelect(state) {
  const select = document.getElementById("periodSelect");
  const options = [...PERIOD_KEYS.map(k => ({ value: k, label: PERIOD_LABELS[k] })), { value: "daily", label: "بازدهی روزانه" }];
  select.innerHTML = options.map(o => `<option value="${o.value}">${o.label}</option>`).join("");
  select.value = "SIMPLE_YEARLY";
  select.onchange = () => renderChart(state, select.value);
  renderChart(state, select.value);
}

function exportExcel(state) {
  const { periods, marketDaily, funds, order } = state;
  const names = order.map(s => FUND_NAMES_FA[s] || s);
  const headers = ["دوره", "از تاریخ", "تا تاریخ", "بازار", ...names];
  const rows = PERIOD_KEYS.map((pk, i) => {
    const p = periods.find(p => p.key === pk);
    return [PERIOD_LABELS[pk], p?.fromDate || "", p?.toDate || "", p?.marketSimpleReturn ?? "", ...order.map(s => funds[s].simpleReturns[i] ?? "")];
  });
  rows.unshift(["بازدهی روزانه", new Date().toLocaleDateString("fa-IR"), new Date().toLocaleDateString("fa-IR"), marketDaily ?? "", ...order.map(s => funds[s].dailyReturn ?? "")]);
  rows.push(["NAV (تومان)", "—", "—", "—", ...order.map(s => funds[s].nav ?? "")]);

  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws["!cols"] = [{ wch: 22 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, ...order.map(() => ({ wch: 14 }))];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "بازدهی صندوق‌ها");
  XLSX.writeFile(wb, `fund-returns-${new Date().toISOString().slice(0, 10)}.xlsx`);
}

let lastFetchedAt = null;

async function loadData(refreshBtnEl) {
  const icon = document.getElementById("refreshIcon");
  if (refreshBtnEl) { refreshBtnEl.disabled = true; icon.classList.add("spin"); }

  let auto = null, manual = null;
  try { auto = await fetch("auto_data.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null); } catch {}
  try { manual = await fetch("manual_data.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null); } catch {}

  const autoList = Array.isArray(auto) ? auto : (auto?.data || []);
  const manualList = Array.isArray(manual) ? manual : (manual?.data || []);
  const state = mergeDatasets(autoList, manualList);

  renderKpis(state);
  renderNav(state);
  renderTable(state);
  setupPeriodSelect(state);

  document.getElementById("exportBtn").disabled = state.order.length === 0;
  document.getElementById("exportBtn").onclick = () => exportExcel(state);

  lastFetchedAt = new Date().toISOString();
  document.getElementById("freshnessText").textContent = `به‌روزرسانی: ${relativeTime(lastFetchedAt)}`;

  if (refreshBtnEl) { refreshBtnEl.disabled = false; icon.classList.remove("spin"); }
}

document.getElementById("todayDate").textContent = todayJalaliLong();
document.getElementById("clockNow").textContent = nowTimeFa();
setInterval(() => {
  document.getElementById("clockNow").textContent = nowTimeFa();
  if (lastFetchedAt) document.getElementById("freshnessText").textContent = `به‌روزرسانی: ${relativeTime(lastFetchedAt)}`;
}, 60_000);

document.getElementById("refreshBtn").addEventListener("click", () => loadData(document.getElementById("refreshBtn")));

loadData();
</script>
</body>
</html>
