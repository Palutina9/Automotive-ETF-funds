<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازدهی صندوق‌های بخشی خودرو</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root {
    /* Corporate clean palette — cool neutrals + blue accent */
    --bg: #F1F5F9;            /* slate-100 page background */
    --panel: #FFFFFF;         /* white panels */
    --ink: #0F172A;           /* slate-900 primary text */
    --ink-soft: #334155;      /* slate-700 secondary text */
    --muted: #64748B;         /* slate-500 muted text */
    --line: #E2E8F0;          /* slate-200 borders */
    --line-strong: #CBD5E1;   /* slate-300 stronger borders */
    --accent: #2563EB;        /* blue-600 corporate accent */
    --accent-soft: #EFF6FF;   /* blue-50 accent background */
    --accent-bar: #3B82F6;    /* blue-500 chart bars */
    --gain: #059669;          /* emerald-600 */
    --gain-bg: #ECFDF5;       /* emerald-50 */
    --loss: #DC2626;          /* red-600 */
    --loss-bg: #FEF2F2;       /* red-50 */
    --nav-row-bg: #F8FAFC;    /* slate-50 for NAV row */
    --daily-row-bg: #EFF6FF;  /* blue-50 for daily row */
    --badge: #C2410C;         /* orange-700 for manual badge */
    --badge-bg: #FFF7ED;      /* orange-50 */
    --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Vazirmatn', sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 64px; }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
  .topbar-inner {
    max-width: 1180px; margin: 0 auto;
    padding: 14px 24px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand h1 { font-size: 17px; font-weight: 700; margin: 0; line-height: 1.3; color: var(--ink); }
  .brand .sub {
    font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 6px; margin-top: 3px;
  }
  .brand .sub .dot { color: var(--line-strong); }

  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .freshness {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--line); color: var(--muted); font-size: 12px;
    background: var(--panel);
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-soft);
    cursor: pointer; font-family: inherit;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { background: #F8FAFC; border-color: var(--line-strong); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #1D4ED8; border-color: #1D4ED8; }
  .icon { width: 15px; height: 15px; flex-shrink: 0; }
  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { padding-top: 24px; }

  /* KPI grid */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px; margin-bottom: 24px;
  }
  .kpi-card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    box-shadow: var(--shadow);
  }
  .kpi-card .label { font-size: 12px; color: var(--muted); margin: 0 0 6px; font-weight: 500; }
  .kpi-card .value {
    font-size: 22px; font-weight: 700; margin: 0;
    font-variant-numeric: tabular-nums; color: var(--ink);
    line-height: 1.2;
  }
  .kpi-card .subvalue { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .kpi-icon {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }

  /* Panels */
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 24px; margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .panel h2 {
    font-size: 15px; font-weight: 700; margin: 0 0 16px;
    color: var(--ink); display: flex; align-items: center; gap: 8px;
  }
  .panel-head {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 16px;
  }
  .panel-head h2 { margin: 0; }
  select.period-select {
    font-family: inherit; font-size: 13px;
    padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    cursor: pointer; font-weight: 500;
  }
  select.period-select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

  .chart-box { height: 360px; position: relative; }

  /* Table — corporate clean */
  .table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line); }
  table {
    width: 100%; border-collapse: collapse; font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  thead th {
    background: #F8FAFC;
    color: var(--ink-soft);
    font-weight: 600; font-size: 12px;
    padding: 14px 12px;
    text-align: center;
    border-bottom: 2px solid var(--line-strong);
    white-space: nowrap;
    letter-spacing: -0.01em;
  }
  thead th:first-child { text-align: right; }
  tbody td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody td:first-child {
    text-align: right;
    font-weight: 600;
    color: var(--ink);
  }
  tbody td.date-cell {
    font-size: 11px; color: var(--muted); font-family: inherit;
    line-height: 1.4;
  }
  tbody td.date-cell .to { color: var(--line-strong); display: block; font-size: 10px; }
  tbody tr:hover { background: #F8FAFC; }
  tbody tr:last-child td { border-bottom: none; }

  /* Daily return row — highlighted */
  tr.daily-row {
    background: var(--daily-row-bg);
    font-weight: 700;
  }
  tr.daily-row td {
    border-bottom: 2px solid var(--line-strong);
    color: var(--ink);
  }
  tr.daily-row td:first-child {
    color: var(--accent);
  }
  tr.daily-row .date-cell {
    color: var(--accent);
    font-weight: 600;
  }

  /* NAV row at the bottom */
  tr.nav-row {
    background: var(--nav-row-bg);
    font-weight: 700;
  }
  tr.nav-row td {
    color: var(--ink);
    border-top: 2px solid var(--line-strong);
  }
  tr.nav-row td:first-child {
    color: var(--ink-soft);
  }

  /* Percent chips */
  .pct {
    font-variant-numeric: tabular-nums; font-weight: 600;
    padding: 4px 10px; border-radius: 6px;
    display: inline-block; font-size: 12px;
    min-width: 64px;
  }
  .pct.gain { color: var(--gain); background: var(--gain-bg); }
  .pct.loss { color: var(--loss); background: var(--loss-bg); }
  .pct.flat { color: var(--muted); background: transparent; }
  .nav-val { font-weight: 700; color: var(--ink); font-size: 12px; }

  .badge-manual {
    font-size: 9px; color: var(--badge); background: var(--badge-bg);
    border: 1px solid #FED7AA; border-radius: 4px;
    padding: 1px 5px; font-weight: 600; margin-inline-start: 6px;
    vertical-align: middle;
  }

  .empty-state { text-align: center; color: var(--muted); padding: 40px 20px; }
  footer {
    text-align: center; color: var(--muted); font-size: 12px;
    margin-top: 16px; padding: 16px 0;
  }
  .table-caption {
    font-size: 11px; color: var(--muted);
    margin-top: 10px; text-align: right;
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } .spin { animation: none !important; } }
  @media (max-width: 640px) {
    .kpi-card .value { font-size: 18px; }
    .brand h1 { font-size: 15px; }
    .panel { padding: 16px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon">
        <svg class="icon" style="width:20px;height:20px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
      </div>
      <div>
        <h1> بازدهی صندوق‌های بخشی خودرویی</h1>
        <div class="sub">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="todayDate">—</span>
          <span class="dot">•</span>

    <div class="topbar-actions">
      <span class="freshness">

      </button>
      <button class="btn primary" id="exportBtn" disabled>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        خروجی اکسل
      </button>
    </div>
  </div>
</div>

<div class="wrap">
<main>

  <section class="kpi-grid" id="kpiGrid"></section>

  <section class="panel">
    <div class="panel-head">
      <h2>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent)"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>

      </h2>

    </div>

  <section class="panel">
    <h2>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent)"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
      جدول مقایسه بازدهی صندوق‌ها
    </h2>

      <div id="tableHost"></div>
    </div>
  </section>

  <footer>داده‌ها به‌صورت خودکار و دستی از منابع رسمی صندوق‌ها گردآوری می‌شود — به‌روزرسانی روزانه ساعت ۱۲:۳۰ به‌وقت تهران</footer>

</main>

<script>
// Map of index-data keys (from the JSON) to the canonical period keys used in the table.
// These are the market-wide auto-sector index returns — separate from the per-fund returns.
const INDEX_KEY_MAP = {
  indexDailyReturn: "daily",
  indexWeeklyReturn: "SIMPLE_WEEKLY",
  indexMonthlyReturn: "SIMPLE_MONTHLY",
  indexQuarterlyReturn: "SIMPLE_MONTHLY3",
  indexSixmonthsReturn: "SIMPLE_MONTHLY6",
  indexAnnualReturn: "SIMPLE_YEARLY",
};
const PERIOD_KEYS = ["SIMPLE_WEEKLY", "SIMPLE_MONTHLY", "SIMPLE_MONTHLY3", "SIMPLE_MONTHLY6", "SIMPLE_YEARLY", "SIMPLE_ALL_DAYS", "MAX_SIMPLE_WEEKLY", "MIN_SIMPLE_WEEKLY"];
const PERIOD_LABELS = {
  SIMPLE_WEEKLY: "هفته گذشته",
  SIMPLE_MONTHLY: "ماه گذشته",
  SIMPLE_MONTHLY3: "۳ ماه اخیر",
  SIMPLE_MONTHLY6: "۶ ماه اخیر",
  SIMPLE_YEARLY: "یک سال اخیر",
  SIMPLE_ALL_DAYS: "از ابتدای فعالیت",
  MAX_SIMPLE_WEEKLY: "حداکثر بازدهی هفتگی",
  MIN_SIMPLE_WEEKLY: "حداقل بازدهی هفتگی",
};
const FUND_NAMES_FA = { AutoAgah: "اتوآگاه ", AutoDariush: "اتوداریوش ", Khodran: "خودران", AutoCar: "اتوکار", BehinRo: "بهین‌رو ", TakhtGaz: "تخت‌گاز" };

// Chart palette — corporate cool
const NAV_BAR_COLOR = "#3B82F6";       // blue-500
const NAV_BAR_BORDER = "#2563EB";      // blue-600
const RETURN_LINE_COLOR = "#8B7A27";   // red-600 (return line)
const RETURN_DOT_GAIN = "#059669";     // emerald-600
const RETURN_DOT_LOSS = "#DC2626";     // red-600
const RETURN_DOT_FLAT = "#64748B";     // slate-500
const MARKET_BAR_COLOR = "#94A3B8";    // slate-400 (market benchmark)
const GRID_COLOR = "#F1F5F9";          // slate-100

function fmtPctText(v) {
  if (v === null || v === undefined || !isFinite(v)) return "—";
  const sign = v > 0 ? "+" : "";
  return sign + v.toLocaleString("fa-IR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "٪";
}
function fmtPct(v) {
  if (v === null || v === undefined || !isFinite(v)) return '<span class="pct flat">—</span>';
  const cls = v > 0 ? "gain" : v < 0 ? "loss" : "flat";
  return `<span class="pct ${cls}">${fmtPctText(v)}</span>`;
}
function fmtNav(v) {
  if (v === null || v === undefined || !isFinite(v)) return "—";
  return Math.round(v).toLocaleString("fa-IR");
}
function fmtNavBillions(v) {
  if (v === null || v === undefined || !isFinite(v)) return "—";
  return (v / 1e9).toLocaleString("fa-IR", { maximumFractionDigits: 1 });
}
function toFaDigits(s) { return String(s).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[Number(d)]); }
function todayJalaliLong() {
  try { return new Intl.DateTimeFormat("fa-IR", { weekday: "long", year: "numeric", month: "long", day: "numeric" }).format(new Date()); }
  catch { return new Date().toLocaleDateString(); }
}
function nowTimeFa() {
  try { return new Intl.DateTimeFormat("fa-IR", { hour: "2-digit", minute: "2-digit" }).format(new Date()); }
  catch { return ""; }
}
function relativeTime(iso) {
  if (!iso) return "هرگز";
  const sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (sec < 60) return "لحظاتی پیش";
  if (sec < 3600) return `${Math.floor(sec / 60)} دقیقه پیش`;
  if (sec < 86400) return `${Math.floor(sec / 3600)} ساعت پیش`;
  return `${Math.floor(sec / 86400)} روز پیش`;
}

function parseDataset(list) {
  const periods = []; let marketDaily = null; let dailyReturnDate = null; const funds = {}; const order = []; const index = {};
  if (!Array.isArray(list)) return { periods, marketDaily, funds, order, index, dailyReturnDate };
  const ensureFund = (slug) => {
    if (!funds[slug]) { funds[slug] = { simpleReturns: new Array(PERIOD_KEYS.length).fill(null), nav: null, dailyReturn: null }; order.push(slug); }
    return funds[slug];
  };
  for (const obj of list) {
    if (!obj || typeof obj !== "object") continue;
    if (obj.key !== undefined) {
      periods.push({ key: obj.key, fromDate: obj.fromDate, toDate: obj.toDate, marketSimpleReturn: obj.marketSimpleReturn });
      continue;
    }
    // Index returns (indexDailyReturn, indexWeeklyReturn, etc.)
    const indexKey = Object.keys(obj)[0];
    if (indexKey && INDEX_KEY_MAP[indexKey] !== undefined) {
      index[INDEX_KEY_MAP[indexKey]] = typeof obj[indexKey] === "number" ? obj[indexKey] : null;
      continue;
    }
    if (obj.marketDailyReturn !== undefined) { marketDaily = obj.marketDailyReturn; continue; }
    if (obj.dailyReturnDate !== undefined) { dailyReturnDate = String(obj.dailyReturnDate); continue; }    
    const entryKey = Object.keys(obj)[0];
    if (!entryKey) continue;
    const value = obj[entryKey];
    let m;
    if ((m = entryKey.match(/^(.+)_fundSimpleReturn$/))) {
      const acc = ensureFund(m[1]);
      const idx = acc.simpleReturns.findIndex(x => x === null);
      if (idx >= 0) acc.simpleReturns[idx] = typeof value === "number" ? value : null;
    } else if ((m = entryKey.match(/^(.+)_fundNAV$/))) {
      ensureFund(m[1]).nav = typeof value === "number" ? value : null;
    } else if ((m = entryKey.match(/^(.+)_fundDailyReturn$/))) {
      ensureFund(m[1]).dailyReturn = typeof value === "number" ? value : null;
    }
  }
  return { periods, marketDaily, funds, order, index, dailyReturnDate };
}

function mergeDatasets(auto, manual) {
  const a = parseDataset(auto), b = parseDataset(manual);
  const periods = a.periods.length ? a.periods : b.periods;
  const marketDaily = a.marketDaily ?? b.marketDaily;
  const dailyReturnDate = a.dailyReturnDate ?? b.dailyReturnDate;
  const index = { ...a.index, ...b.index };
  const funds = { ...a.funds, ...b.funds };
  const order = [...a.order, ...b.order.filter(s => !a.order.includes(s))];
  const manualSlugs = new Set(b.order);
  return { periods, marketDaily, funds, order, manualSlugs, index, dailyReturnDate };
}

function renderKpis(state) {
  const { funds, order } = state;
  const grid = document.getElementById("kpiGrid");
  const totalNav = order.reduce((s, slug) => s + (funds[slug].nav || 0), 0);
  const dailyVals = order.map(s => funds[s].dailyReturn).filter(v => v !== null && isFinite(v));
  const avgDaily = dailyVals.length ? dailyVals.reduce((s, v) => s + v, 0) / dailyVals.length : null;
  const weekIdx = PERIOD_KEYS.indexOf("SIMPLE_WEEKLY");
  let best = null;
  for (const slug of order) {
    const v = funds[slug].simpleReturns[weekIdx];
    if (v !== null && isFinite(v) && (!best || v > best.value)) best = { name: FUND_NAMES_FA[slug] || slug, value: v };
  }

  const cards = [
    { label: "تعداد صندوق‌ها", value: toFaDigits(String(order.length)), sub: null, bg: "var(--accent-soft)", fg: "var(--accent)",
      icon: '<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/>' },
    { label: "مجموع دارایی (NAV)", value: fmtNav(totalNav), sub: "مجموع خالص ارزش دارایی‌ها", bg: "var(--gain-bg)", fg: "var(--gain)",
      icon: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/>' },
    { label: "میانگین بازدهی روزانه", value: fmtPctText(avgDaily), sub: "میانگین همه صندوق‌ها", bg: (avgDaily ?? 0) < 0 ? "var(--loss-bg)" : "var(--gain-bg)", fg: (avgDaily ?? 0) < 0 ? "var(--loss)" : "var(--gain)",
      icon: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>' },
    { label: "بهترین بازدهی هفتگی", value: best ? fmtPctText(best.value) : "—", sub: best ? best.name : "—", bg: "#FFF7ED", fg: "#C2410C",
      icon: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>' },
  ];

  grid.innerHTML = cards.map(c => `
    <div class="kpi-card">
      <div>
        <p class="label">${c.label}</p>
        <p class="value">${c.value}</p>
        ${c.sub ? `<p class="subvalue">${c.sub}</p>` : ""}
      </div>
      <div class="kpi-icon" style="background:${c.bg};color:${c.fg}">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${c.icon}</svg>
      </div>
    </div>
  `).join("");
}

function renderTable(state) {
  const { periods, marketDaily, funds, order, manualSlugs, index, dailyReturnDate } = state;
  const host = document.getElementById("tableHost");
  if (order.length === 0 && periods.length === 0) { host.innerHTML = '<div class="empty-state">هنوز داده‌ای برای نمایش وجود ندارد</div>'; return; }

  const fundEntries = order
    .map((slug, i) => ({ slug, name: FUND_NAMES_FA[slug] || slug, ret: returnValues[i], nav: funds[slug].nav }))
    .sort((a, b) => {
      // Funds with null/NaN returns go to the end.
      const av = a.ret === null || !isFinite(a.ret) ? -Infinity : a.ret;
      const bv = b.ret === null || !isFinite(b.ret) ? -Infinity : b.ret;
      return bv - av;  // descending
    });

  // X-axis labels: market + شاخص خودرو + sorted funds.
  const labels = ["بازار", "شاخص خودرو", ...fundEntries.map(e => e.name)];
  // NAV data (market and index have no NAV — null).
  const navData = [null, null, ...fundEntries.map(e => e.nav)];
  // Return line: market + index + sorted fund returns.
  const marketData = [marketReturn, indexReturn, ...fundEntries.map(e => e.ret)];
  // Index line (kept for reference, same as before).
  const indexLineData = [null, indexReturn, ...fundEntries.map(() => null)];

  // Daily return row — date comes from JSON (dailyReturnDate), falls back to today
  const dailyDateStr = dailyReturnDate
    ? toFaDigits(dailyReturnDate)
    : new Date().toLocaleDateString("fa-IR");
  const dailyRow = `<tr class="daily-row">
    <td>بازدهی روزانه</td>
    <td class="date-cell">${dailyDateStr}</td>
    <td>${fmtPct(marketDaily)}</td>
    <td>${fmtPct(index.daily)}</td>
    ${order.map(slug => `<td>${fmtPct(funds[slug].dailyReturn)}</td>`).join("")}
  </tr>`;
  
  // Period rows — SIMPLE_ALL_DAYS and MIN_SIMPLE_WEEKLY show no dates
  const NO_DATE_PERIODS = new Set(["SIMPLE_ALL_DAYS", "MIN_SIMPLE_WEEKLY", "MAX_SIMPLE_WEEKLY"]);
  const periodRows = PERIOD_KEYS.map((pk, i) => {
    const periodRow = periods.find(p => p.key === pk);
    const marketVal = periodRow ? periodRow.marketSimpleReturn : null;
    const indexVal = index[pk] ?? null;
    const showDate = periodRow && !NO_DATE_PERIODS.has(pk);
    const fromDate = showDate ? toFaDigits(periodRow.fromDate) : "";
    const toDate = showDate ? toFaDigits(periodRow.toDate) : "";
    const dateCell = showDate
      ? `<td class="date-cell">${fromDate}<span class="to">تا ${toDate}</span></td>`
      : `<td class="date-cell">—</td>`;
    return `<tr>
      <td>${PERIOD_LABELS[pk]}</td>
      ${dateCell}
      <td>${fmtPct(marketVal)}</td>
      <td>${fmtPct(indexVal)}</td>
      ${order.map(slug => `<td>${fmtPct(funds[slug].simpleReturns[i])}</td>`).join("")}
    </tr>`;
  }).join("");

  // NAV row (at the bottom) — شاخص خودرو has no NAV, show —
  const navRow = `<tr class="nav-row">
    <td>خالص ارزش دارایی (NAV)</td>
    <td class="date-cell">—</td>
    <td>—</td>
    <td>—</td>
    ${order.map(slug => `<td><span class="nav-val">${fmtNav(funds[slug].nav)}</span></td>`).join("")}
  </tr>`;

  host.innerHTML = `<table><thead>${head}</thead><tbody>${dailyRow}${periodRows}${navRow}</tbody></table>`;
}

// Dual-axis chart: NAV bars (left) + return lines (right)
let chartInstance = null;
function renderChart(state, selectedKey) {
  const { periods, marketDaily, funds, order, index } = state;
  const ctx = document.getElementById("periodChart");

  let returnValues, marketReturn, indexReturn;
  if (selectedKey === "daily") {
    marketReturn = marketDaily;
    indexReturn = index.daily ?? null;
    returnValues = order.map(s => funds[s].dailyReturn);
  } else {
    const idx = PERIOD_KEYS.indexOf(selectedKey);
    const periodRow = periods.find(p => p.key === selectedKey);
    marketReturn = periodRow ? periodRow.marketSimpleReturn : null;
    indexReturn = index[selectedKey] ?? null;
    returnValues = order.map(s => funds[s].simpleReturns[idx]);
  }

  // X-axis labels: market + شاخص خودرو + each fund.
  const labels = ["بازار", "شاخص خودرو", ...order.map(s => FUND_NAMES_FA[s] || s)];
  // NAV data (market and index have no NAV — null).
  const navData = [null, null, ...order.map(s => funds[s].nav)];
  // Market return line (benchmark).
  const marketData = [marketReturn, indexReturn, ...returnValues];
  // Index return line (auto-sector index) — same value at the شاخص خودرو position, null elsewhere.
  const indexLineData = [null, indexReturn, ...order.map(() => null)];

  if (chartInstance) chartInstance.destroy();

  // If no data at all, just clear.
  const hasAny = marketData.some(v => v !== null && isFinite(v)) || navData.some(v => v !== null && isFinite(v));
  if (!hasAny) {
    const c = ctx.getContext("2d");
    c.clearRect(0, 0, ctx.width, ctx.height);
    return;
  }

  // Build dot colors per point based on return sign.
  const dotColors = marketData.map(v =>
    v === null || !isFinite(v) ? RETURN_DOT_FLAT :
    v > 0 ? RETURN_DOT_GAIN :
    v < 0 ? RETURN_DOT_LOSS :
    RETURN_DOT_FLAT
  );

  // Bar colors: market = slate, index = teal, each fund gets its own color.
  const INDEX_BAR_COLOR = "#14B8A6"; // teal-500 for شاخص خودرو
  const FUND_PALETTE = [
    "#3B82F6", // blue-500
    "#8B5CF6", // violet-500
    "#F97316", // orange-500
    "#EC4899", // pink-500
    "#F59E0B", // amber-500
    "#10B981", // emerald-500
    "#06B6D4", // cyan-500
    "#84CC16", // lime-500
  ];
  const barColors = [MARKET_BAR_COLOR, INDEX_BAR_COLOR, ...order.map((_, i) => FUND_PALETTE[i % FUND_PALETTE.length])];
  // Darken each color slightly for the border (just reuse the same color).
  const barBorders = barColors;

  chartInstance = new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: [
        {
          type: "bar",
          label: "NAV (میلیارد تومان)",
          data: navData,
          backgroundColor: barColors,
          borderColor: barBorders,
          borderWidth: 1,
          borderRadius: 6,
          maxBarThickness: 56,
          yAxisID: "yNav",
          order: 3,
        },
        {
          type: "line",
          label: "بازدهی (٪)",
          data: marketData,
          borderColor: RETURN_LINE_COLOR,
          backgroundColor: RETURN_LINE_COLOR + "20",
          borderWidth: 2.5,
          tension: 0.25,
          pointRadius: 6,
          pointHoverRadius: 8,
          pointBackgroundColor: dotColors,
          pointBorderColor: "#FFFFFF",
          pointBorderWidth: 2,
          fill: false,
          yAxisID: "yReturn",
          order: 1,
          spanGaps: true,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: {
          display: true,
          position: "top",
          align: "end",
          labels: {
            font: { family: "Vazirmatn", size: 12 },
            color: "#334155",
            usePointStyle: true,
            boxWidth: 8,
            padding: 16,
          },
        },
        tooltip: {
          backgroundColor: "#FFFFFF",
          titleColor: "#0F172A",
          bodyColor: "#334155",
          borderColor: "#E2E8F0",
          borderWidth: 1,
          padding: 12,
          cornerRadius: 8,
          titleFont: { family: "Vazirmatn", weight: "700", size: 13 },
          bodyFont: { family: "Vazirmatn", size: 12 },
          callbacks: {
            label: function(context) {
              const v = context.parsed.y;
              if (v === null || v === undefined || !isFinite(v)) return null;
              if (context.dataset.yAxisID === "yReturn") {
                const sign = v > 0 ? "+" : "";
                return ` ${context.dataset.label}: ${sign}${v.toLocaleString("fa-IR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}٪`;
              } else {
                // NAV — show full number + میلیارد
                return ` ${context.dataset.label}: ${Math.round(v).toLocaleString("fa-IR")} (${(v / 1e9).toLocaleString("fa-IR", { maximumFractionDigits: 1 })} میلیارد)`;
              }
            },
          },
        },
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: {
            font: { family: "Vazirmatn", size: 12 },
            color: "#334155",
            maxRotation: 0,
            autoSkip: false,
          },
        },
        yNav: {
          type: "linear",
          position: "left",
          beginAtZero: true,
          grid: { color: GRID_COLOR, drawBorder: false },
          ticks: {
            font: { family: "Vazirmatn", size: 11 },
            color: "#64748B",
            callback: function(v) {
              return (v / 1e9).toLocaleString("fa-IR", { maximumFractionDigits: 0 });
            },
          },
          title: {
            display: true,
            text: "NAV (میلیارد تومان)",
            font: { family: "Vazirmatn", size: 11, weight: "600" },
            color: "#64748B",
          },
        },
        yReturn: {
          type: "linear",
          position: "right",
          grid: { display: false },
          ticks: {
            font: { family: "Vazirmatn", size: 11 },
            color: "#64748B",
            callback: function(v) {
              return v.toLocaleString("fa-IR", { maximumFractionDigits: 0 }) + "٪";
            },
          },
          title: {
            display: true,
            text: "بازدهی (٪)",
            font: { family: "Vazirmatn", size: 11, weight: "600" },
            color: "#64748B",
          },
        },
      },
    },
  });
}

function setupPeriodSelect(state) {
  const select = document.getElementById("periodSelect");
  const options = [...PERIOD_KEYS.map(k => ({ value: k, label: PERIOD_LABELS[k] })), { value: "daily", label: "بازدهی روزانه" }];
  select.innerHTML = options.map(o => `<option value="${o.value}">${o.label}</option>`).join("");
  select.value = "SIMPLE_WEEKLY";
  select.onchange = () => { renderChart(state, select.value); document.getElementById("chartImgBtn").disabled = !chartInstance; };
  renderChart(state, select.value);
  document.getElementById("chartImgBtn").disabled = !chartInstance;
}

function downloadChartImage() {
  if (!chartInstance) return;
  // Render at 2x resolution for crisp output.
  const url = chartInstance.toBase64Image("image/png", 1);
  const a = document.createElement("a");
  a.href = url;
  a.download = `fund-chart-${new Date().toISOString().slice(0, 10)}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function exportExcel(state) {
  const { periods, marketDaily, funds, order, index } = state;
  const names = order.map(s => FUND_NAMES_FA[s] || s);
  const headers = ["دوره", "از تاریخ", "تا تاریخ", "بازار", "شاخص خودرو", ...names];
  const rows = PERIOD_KEYS.map((pk, i) => {
    const p = periods.find(p => p.key === pk);
    return [PERIOD_LABELS[pk], p?.fromDate || "", p?.toDate || "", p?.marketSimpleReturn ?? "", index[pk] ?? "", ...order.map(s => funds[s].simpleReturns[i] ?? "")];
  });
  rows.unshift(["بازدهی روزانه", new Date().toLocaleDateString("fa-IR"), new Date().toLocaleDateString("fa-IR"), marketDaily ?? "", index.daily ?? "", ...order.map(s => funds[s].dailyReturn ?? "")]);
  rows.push(["NAV (تومان)", "—", "—", "—", "—", ...order.map(s => funds[s].nav ?? "")]);

  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws["!cols"] = [{ wch: 22 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 14 }, ...order.map(() => ({ wch: 14 }))];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "بازدهی صندوق‌ها");
  XLSX.writeFile(wb, `fund-returns-${new Date().toISOString().slice(0, 10)}.xlsx`);
}

let lastFetchedAt = null;

async function loadData(refreshBtnEl) {
  const icon = document.getElementById("refreshIcon");
  if (refreshBtnEl) { refreshBtnEl.disabled = true; icon.classList.add("spin"); }

  let auto = null, manual = null;
  try { auto = await fetch("auto_data.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null); } catch {}
  try { manual = await fetch("manual_data.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null); } catch {}

  const autoList = Array.isArray(auto) ? auto : (auto?.data || []);
  const manualList = Array.isArray(manual) ? manual : (manual?.data || []);
  const state = mergeDatasets(autoList, manualList);

  renderKpis(state);
  renderTable(state);
  setupPeriodSelect(state);

  document.getElementById("exportBtn").disabled = state.order.length === 0;
  document.getElementById("exportBtn").onclick = () => exportExcel(state);
  document.getElementById("chartImgBtn").disabled = !chartInstance;
  document.getElementById("chartImgBtn").onclick = () => downloadChartImage();

  lastFetchedAt = new Date().toISOString();
  document.getElementById("freshnessText").textContent = `به‌روزرسانی: ${relativeTime(lastFetchedAt)}`;

  if (refreshBtnEl) { refreshBtnEl.disabled = false; icon.classList.remove("spin"); }
}

document.getElementById("todayDate").textContent = todayJalaliLong();
document.getElementById("clockNow").textContent = nowTimeFa();
setInterval(() => {
  document.getElementById("clockNow").textContent = nowTimeFa();
  if (lastFetchedAt) document.getElementById("freshnessText").textContent = `به‌روزرسانی: ${relativeTime(lastFetchedAt)}`;
}, 60_000);

document.getElementById("refreshBtn").addEventListener("click", () => loadData(document.getElementById("refreshBtn")));

loadData();
</script>
